@media(max-width:600px){.craft-map{background-size:100% auto;background-position:center 40%;background-repeat:no-repeat;background-color:#7cc6ee;aspect-ratio:.83}.map-bottom{flex-wrap:nowrap;justify-content:space-between;align-items:center;bottom:3%}.map-bottom .btn{order:0;width:auto;max-width:none;margin:0;padding:10px 15px;font-size:17px;min-width:95px}.map-bottom .secondary{padding:8px 8px;font-size:10px;white-space:nowrap}.district-2,.district-3{top:70%}.map-badge{top:15%;background:#392e24f5}}

/* VerbCraft 2.2 — crafted controls and a coherent voxel icon set. */
.craft-icon{width:32px;height:32px;display:inline-block;flex-shrink:0;vertical-align:middle;pointer-events:none;filter:drop-shadow(0 2px 0 #2c201a35);overflow:visible}
.brandmark{background:transparent;border:0;box-shadow:none;width:43px;height:43px}.brandmark .craft-icon{width:43px;height:43px}
nav a{display:inline-flex;align-items:center;justify-content:center;gap:7px}nav .craft-icon{width:22px;height:22px;filter:drop-shadow(0 2px #201a14)}nav a:hover{color:#ffe8a7}nav a.active{background:#ffffff09}nav{gap:19px}
.btn,button.primary{position:relative;border:3px solid #49311c;border-top-color:#6d4826;border-radius:5px;background:repeating-linear-gradient(0deg,transparent 0 14px,#9b602326 14px 15px),linear-gradient(90deg,#bd803c,#d59a4f 45%,#ba7936);box-shadow:inset 0 3px #ffe0a088,inset 3px 0 #ebbb76,inset -3px 0 #98602c,inset 0 -4px #8f5828,0 5px #3f2e1d,0 7px 0 #1c251d33;color:#30220f;text-shadow:0 1px #ffe6b1;font-weight:850;letter-spacing:.2px;min-height:48px;transition:background .12s,transform .12s,box-shadow .12s}
.btn:hover,button.primary:hover{background:repeating-linear-gradient(0deg,transparent 0 14px,#9b602326 14px 15px),linear-gradient(90deg,#d7984a,#edb45e 45%,#d18f3d);box-shadow:inset 0 3px #ffeab8,inset 3px 0 #f6d598,inset -3px 0 #a2692e,inset 0 -4px #98612b,0 6px #3f2e1d,0 8px #1c251d33;transform:translateY(-1px)}
.btn:active,button.primary:active{transform:translateY(4px);box-shadow:inset 0 2px #a36b2e,inset 0 -2px #855124,0 1px #3f2e1d}.btn .craft-icon,button.primary .craft-icon{width:25px;height:25px;margin-right:8px}
.secondary{background:linear-gradient(#fff6d6 0 8%,#f5e8bf 8% 88%,#dfcc97 88%);border:2px solid #7b6a42;border-top-color:#a18a56;border-bottom:4px solid #6b5b39;box-shadow:inset 2px 0 #fff9df,inset -2px 0 #c4b078,0 2px #443c2633;border-radius:4px;min-height:43px;text-shadow:0 1px #fff9df;transition:transform .12s,background .12s}
.secondary:hover{background:linear-gradient(#fff9e1,#fff1c3);border-color:#75653a;transform:translateY(-1px)}.secondary:active{transform:translateY(2px);box-shadow:inset 0 2px #b7a373;filter:brightness(.98)}
.secondary .craft-icon,.crafted-control .craft-icon{width:24px;height:24px;margin-right:7px}.crafted-control{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;gap:0}.secondary.small{min-height:35px}.secondary.small .craft-icon{width:20px;height:20px;margin-right:5px}
button:disabled{filter:saturate(.35);box-shadow:none!important;transform:none!important;opacity:.65}.build-option button:disabled{opacity:.7}.listen{display:inline-flex;align-items:center;justify-content:center}.listen .craft-icon{width:38px;height:38px;margin:0}.listen:hover{background:#afcd7b;transform:translateY(-1px)}
.world-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:65px;min-width:190px;border:3px solid #493626;border-top-color:#ae854f;border-bottom:6px solid #3d2b1c;border-radius:5px;background:repeating-linear-gradient(0deg,transparent 0 20px,#38251025 20px 22px),linear-gradient(#a16d39,#80522e);box-shadow:inset 0 3px #dab477,inset 3px 0 #b5874c,inset -3px 0 #5f3f26,0 4px #243b26b0;padding:9px 14px;text-align:left;color:#fff6df;text-shadow:1px 2px #372414;isolation:isolate}
.world-button::before{content:'';width:5px;position:absolute;left:5px;top:8px;bottom:8px;background:var(--district);box-shadow:inset 0 2px #ffffff55,1px 0 #2c281b80;z-index:-1}.district-icon{padding:1px;display:grid;place-items:center}.district-icon .craft-icon{width:38px;height:38px;filter:drop-shadow(1px 3px 0 #3b241d)}.district-label{display:block;font-size:17px;line-height:1.1;font-weight:850}.district-label small{font-size:10px;margin-top:5px;color:#f5e7c5;font-weight:500;letter-spacing:.2px}.world-button:hover{background:repeating-linear-gradient(0deg,transparent 0 20px,#38251025 20px 22px),linear-gradient(#b98449,#986330);filter:none;box-shadow:inset 0 3px #f4ce8a,inset 3px 0 #bd9758,inset -3px 0 #704a28,0 5px #243b26b0;transform:translate(-50%,-53%)}.world-button:active{transform:translate(-50%,-47%);box-shadow:inset 0 2px #704b2b,0 1px #243b26b0}
.map-bottom>a{display:inline-flex;align-items:center;justify-content:center;gap:7px}.map-bottom .btn{font-size:26px;border-width:4px;min-width:210px;min-height:65px;background:repeating-linear-gradient(0deg,transparent 0 16px,#9b602322 16px 18px),linear-gradient(#e2b469,#c38b43);box-shadow:inset 0 4px #ffe5ac,inset 4px 0 #edc37e,inset -4px 0 #9b682f,inset 0 -4px #9c652e,0 5px #3d291c,0 8px #21351d33}.map-bottom .btn .craft-icon{width:35px;height:35px;margin-right:0}.map-bottom .secondary{background:linear-gradient(#fff6d6,#e9d69e);border-color:#6d512f;box-shadow:inset 2px 2px #fffbe6,inset -2px -2px #c8b176,0 3px #493820;min-height:48px}.map-bottom .secondary .craft-icon{width:28px;height:28px;margin:0}

function guide() {
  app.innerHTML = '<div class="prose"><span class="eyebrow">Des choix pédagogiques explicites</span><h1>Apprendre pour retrouver.<br><em>Retrouver pour utiliser.</em></h1><section class="panel"><h2>Ton parcours en quatre petits pas</h2><div class="quickgrid"><div><b>1 · Découvrir</b><p>Choisis un thème et un petit lot. Observe les quatre colonnes et écoute chaque forme.</p></div><div><b>2 · Rappeler</b><p>Cache les réponses. Essaie de les retrouver avant d’utiliser un indice.</p></div><div><b>3 · Réutiliser</b><p>Complète des phrases, construis-les, puis écris ton propre récit.</p></div></div><p class="notice"><b>4 · Revenir</b> demain, puis dans quelques jours. Le carnet t’aide à retrouver les verbes à réviser.</p></section><section class="panel"><h2>Ce que dit la recherche</h2><details open><summary>Le rappel actif : essayer avant de regarder</summary><p>Les travaux de Karpicke et Roediger (2008), sur l’apprentissage de vocabulaire en langue étrangère, montrent l’intérêt de récupérer l’information en mémoire. Ici, le trio et les phrases à compléter exigent une réponse sans choix proposés. Les cartes seules ne font pas progresser le niveau de consolidation.</p><a href="https://doi.org/10.1126/science.1182408" target="_blank" rel="noopener">Karpicke & Roediger · The Critical Importance of Retrieval for Learning</a></details><details open><summary>L’espacement : plusieurs jours plutôt qu’une seule grosse séance</summary><p>La synthèse de Dunlosky et al. (2013) identifie les tests d’entraînement et la pratique distribuée comme des techniques largement utiles. Ici, un rappel réussi sans aide propose un retour après 1, 3, 7, 14 puis 30 jours. Une erreur remet la forme au départ et programme un rappel dans 10 minutes. Une même forme ne monte qu’une fois par jour. Ces délais sont un choix pratique de l’application, pas un calendrier optimal universel validé pour chaque élève.</p><a href="https://doi.org/10.1177/1529100612453266" target="_blank" rel="noopener">Dunlosky et al. · Improving Students’ Learning With Effective Learning Techniques</a></details><details><summary>Une correction utile, puis une nouvelle tentative</summary><p>Après chaque réponse, tu vois le trio et tu peux l’écouter. Dans les exercices, un item échoué revient une fois après deux autres questions quand il en reste suffisamment. Une aide n’est pas comptée comme un rappel autonome. Le mélange des verbes limite le recours à l’ordre de la liste ; son bénéfice spécifique dans cette application n’a pas été évalué.</p></details><details><summary>La motivation : progresser sans pression</summary><p>Pas de vies perdues, de classement ou de chronomètre imposé. Les XP saluent l’effort et les réussites, les badges encouragent les retours. Les points ne prouvent pas qu’un verbe est mémorisé. La consolidation exige des réussites espacées sans aide sur chaque forme ; elle reste un indicateur pédagogique local.</p></details></section><section class="panel"><h2>Fidélité aux documents et corrections</h2><p>Les quatre univers, les dix-huit sous-thèmes et l’ordre des 119 entrées sont conservés. Trois verbes complémentaires (see, let et fly) ont été ajoutés dans Interacting, Friendship et Moving. La sélection « Les essentiels » regroupe 30 verbes pour démarrer : c’est un choix pédagogique, pas un classement de fréquence certifié. Les 118 verbes distincts partagent leur progression quand ils apparaissent dans plusieurs thèmes. L’interface reprend leurs couleurs : violet, orange, vert et turquoise.</p><p><b>Corrections :</b> lay → laid → laid ; grow (up) → grew (up) → grown (up) ; bear → bore → borne pour « porter / supporter ». Born est réservé au sens de naissance. Ces corrections sont signalées dans l’atlas.</p><p>Les variantes usuelles telles que learnt/learned, dreamt/dreamed et got/gotten sont acceptées selon la forme. Les usages de sens ou de registre restent à expliquer en classe. Dans l’exercice du trio, was ou were est accepté ; dans « They ___ at school yesterday », seule were convient.</p></section><section class="panel"><h2>Écoute, accessibilité et sauvegarde</h2><p>La lecture utilise la synthèse vocale de ton appareil, avec préférence britannique ou américaine. La voix réelle et la disponibilité hors connexion dépendent du navigateur et des voix installées. Aucune piste audio préenregistrée n’est incluse. Pour read, les boutons isolés distinguent /riːd/ et /red/ ; fais écouter aussi les phrases.</p><p>L’application s’utilise au clavier ou au toucher, respecte la préférence de réduction des animations et ne demande ni compte ni micro. Aucun traceur n’est ajouté. Les données restent dans le navigateur ; une voix de synthèse peut dépendre du service vocal du système. Exporte régulièrement ton carnet.</p></section><section class="panel"><h2>Conseil pour la classe</h2><p>Commence par un petit lot thématique, fais découvrir et rappeler, puis reviens sur les mêmes verbes quelques jours plus tard. Termine par une production courte. Les groupes thématiques facilitent le choix d’un contexte ; les familles AAA / ABB / ABA / ABC sont une autre façon d’observer les formes, sans remplacer le sens.</p></section></div>';
}
